# `slack-bridge` — the fleet's Slack↔board bridge adapter daemon (design #141, tasks #152/#154).
#
# This adapter is TRANSPORT + SYNC only: it subscribes to the board-wide event firehose and runs the
# board↔Slack sync over the Slack Socket Mode transport. The board owns the bridge CORE (channel-map,
# external-identity, outbound-authz) — those are board-side primitives this crate consumes, not
# reimplements. It is one instance of a generic external-source bridge (Slack today; a GitHub adapter
# reuses the same board core via #136), so Slack-specifics stay in this crate and shared concerns live
# on the board.
#
# The crate is a workspace member so `cargo test` at the workspace root gates its pure core (config
# resolution, attribution formatting, mapping, dedup). The heavy SLACK transport tree (slack-morphism +
# the Socket Mode WebSocket stack) is deferred behind a `transport` feature so it never enters the default
# `cargo test`. NOTE: bridge-core's async board client (reqwest, operator directive #370) does bring an
# async HTTP tree (reqwest/tokio/hyper/rustls) into the default build — the board I/O is async now, so the
# runner `.await`s it directly (no spawn_blocking); only the Slack-specific transport stays feature-gated.
[package]
name = "slack-bridge"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "slack_bridge"
path = "src/lib.rs"

# The daemon binary — the thin async transport shell. Gated behind `required-features = ["transport"]` so
# the default `cargo test --workspace` / `nix flake check` never builds it or COMPILES its heavy async
# tree (slack-morphism/tokio/hyper/rustls). Build/run it with `--features transport`.
[[bin]]
name = "slack-bridge"
path = "src/main.rs"
required-features = ["transport"]

[features]
# The live Slack Socket Mode transport. Off by default; pulls the heavy async tree only when enabled.
transport = ["dep:slack-morphism", "dep:tokio", "dep:tracing", "dep:tracing-subscriber", "dep:clap"]

[dependencies]
# The transport-agnostic bridge core (board REST client, sync planning, channel map, relay resilience),
# shared with the voice bridge (#316). Slack-specifics (mrkdwn shaping, Socket Mode) stay in this crate.
bridge-core = { path = "../bridge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The daemon's config format: a single TOML file (operator mandate #159 — no env-var config). Holds
# credentials + wiring; delivered at deploy time as the agenix-decrypted secret, gitignored in dev.
toml = "0.8"
# Minimal blocking HTTP client for the board's token-less localhost REST firehose (`GET /events` poll +
# `POST /channels/:id/posts`). Same client the `fleet` orchestrator uses for its board REST access; light
# and blocking — the sync core, NOT the heavy async Slack transport (that's the `transport` feature).
ureq = "2"

# ── The async Slack transport tree — OPTIONAL, pulled only by the `transport` feature (see above). ──
# The Slack transport. `hyper` feature bundles Socket Mode (via tokio-tungstenite) + the Hyper client.
slack-morphism = { version = "2.23", features = ["hyper"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
# `--config <path>` CLI flag (the ONLY thing chosen outside the TOML file; mandate #159).
clap = { version = "4", features = ["derive"], optional = true }
